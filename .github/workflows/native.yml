# Builds the native (Godot) game for macOS, Windows and Linux and attaches
# the three downloads to the workflow run. Start it by hand from the Actions
# tab, or push a tag like native-v0.1.
name: Native builds
on:
  workflow_dispatch:
  push:
    tags: ['native-v*']
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      GODOT: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Get Godot and its export templates
        run: |
          curl -sL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sL -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT}.stable
          unzip -q -j templates.tpz 'templates/*' -d ~/.local/share/godot/export_templates/${GODOT}.stable
      - name: Import and export
        run: |
          mkdir -p build && cd godot
          godot --headless --import || true
          godot --headless --export-release "macOS" ../build/GizaPlateau-macOS.zip
          godot --headless --export-release "Linux" ../build/GizaPlateau-linux.x86_64
          godot --headless --export-release "Windows Desktop" ../build/GizaPlateau-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GizaPlateau-native
          path: build/
